services:
  api:
    image: ${API_IMAGE:?API_IMAGE is required}
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:?APP_ENV is required}
      DATABASE_URL: ${DATABASE_URL}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?PUBLIC_BASE_URL is required}
      SERVER_ADDR: ${SERVER_ADDR:-0.0.0.0:3000}
      RUST_LOG: ${RUST_LOG:-friendminton=info,tower_http=info}
      AWS_REGION: ${AWS_REGION:-us-west-2}
      GOOGLE_PLACES_API_KEY: ${GOOGLE_PLACES_API_KEY:?GOOGLE_PLACES_API_KEY is required}
      S3_BUCKET: ${S3_BUCKET}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET is required}
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:-}
      APPLE_CLIENT_ID: ${APPLE_CLIENT_ID:-}
      APPLE_TEAM_ID: ${APPLE_TEAM_ID:-}
      APPLE_KEY_ID: ${APPLE_KEY_ID:-}
      APPLE_PRIVATE_KEY_BASE64: ${APPLE_PRIVATE_KEY_BASE64:-}
      MOBILE_AUTH_CALLBACK_URL: ${MOBILE_AUTH_CALLBACK_URL:-friendminton://auth/callback}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:?EMAIL_PROVIDER is required}
      SES_REGION: ${SES_REGION:-us-west-2}
      SES_FROM_NAME: ${SES_FROM_NAME:-Friendminton}
      SES_FROM_ADDRESS: ${SES_FROM_ADDRESS:?SES_FROM_ADDRESS is required}
      SES_REPLY_TO_ADDRESS: ${SES_REPLY_TO_ADDRESS:-}
      SES_CONFIGURATION_SET: ${SES_CONFIGURATION_SET:?SES_CONFIGURATION_SET is required}
      SES_AWS_ACCESS_KEY_ID: ${SES_AWS_ACCESS_KEY_ID:?SES_AWS_ACCESS_KEY_ID is required}
      SES_AWS_SECRET_ACCESS_KEY: ${SES_AWS_SECRET_ACCESS_KEY:?SES_AWS_SECRET_ACCESS_KEY is required}
      SES_AWS_SESSION_TOKEN: ${SES_AWS_SESSION_TOKEN:-}
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "3000"

  postgres:
    image: postgis/postgis:17-3.5-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - api
    environment:
      DOMAIN: ${DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
