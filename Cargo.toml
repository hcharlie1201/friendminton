[package]
name = "friendminton"
version = "0.1.0"
edition = "2024"

[dependencies]
aide = { version = "0.15.1", features = ["axum", "axum-json", "axum-query", "swagger"] }
aws-config = { version = "1", default-features = false, features = ["rt-tokio", "rustls"] }
aws-credential-types = "1"
aws-sdk-s3 = { version = "1", default-features = false, features = ["rt-tokio", "rustls"] }
aws-sdk-sesv2 = { version = "1", default-features = false, features = ["rt-tokio", "rustls"] }
aws-types = "1"
axum = "0.8.9"
base64 = "0.22"
better-auth = { version = "=0.10.0", default-features = false, features = ["derive", "rustls", "sqlx-postgres"] }
better-auth-core = { version = "=0.10.0", features = ["derive", "sqlx-postgres"] }
chrono = { version = "0.4", features = ["serde"] }
config = { version = "0.15", default-features = false, features = ["toml"] }
dotenvy = "0.15"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
schemars = { version = "0.9.0", features = ["uuid1"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8.6", features = ["runtime-tokio-rustls", "postgres", "uuid", "time", "json", "migrate"] }
thiserror = "2.0.17"
time = { version = "0.3.53", features = ["serde", "serde-well-known"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6.8", features = ["fs", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }
url = "2"
uuid = { version = "1.23.4", features = ["serde", "v4"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
